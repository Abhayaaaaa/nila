services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: glof_db
      POSTGRES_PASSWORD: glof_dev_pw
    volumes:
      - glof_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:glof_dev_pw@db:5432/glof_db
      ADMIN_TOKEN: dev-admin-token-change-me
      SECRET_KEY: dev-secret-change-me
      CDSE_CLIENT_ID: ${CDSE_CLIENT_ID:-}
      CDSE_CLIENT_SECRET: ${CDSE_CLIENT_SECRET:-}
      RISK_RECOMPUTE_INTERVAL_HOURS: "24"
    ports:
      - "5050:5050"

volumes:
  glof_pgdata:
