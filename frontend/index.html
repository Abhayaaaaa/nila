<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NILA, the Nepal Ice Lake Atlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%B0%EF%B8%8F%3C/text%3E%3C/svg%3E">

<link rel="stylesheet" href="static/vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="static/vendor/markercluster/MarkerCluster.css" />
<link rel="stylesheet" href="static/vendor/markercluster/MarkerCluster.Default.css" />
<link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-icon">⛰️</span>
    <div>
      <h1>NILA</h1>
      <p class="tagline">Glacial Lake Outburst Flood risk monitor</p>
    </div>
  </div>

  <form id="search-form" class="search-form">
    <input id="search-input" type="text" placeholder="Search a place in Nepal (e.g. Namche Bazaar, Pokhara)..." autocomplete="off" />
    <button type="submit">Search</button>
  </form>

  <button id="open-report-modal" class="report-cta">
    <span class="report-cta-icon">＋</span> Submit a report
  </button>
</header>

<div id="stats-bar" class="stats-bar"></div>

<main class="layout">
  <div id="map"></div>

  <aside id="side-panel" class="side-panel hidden">
    <button id="close-panel" class="close-btn" aria-label="Close">×</button>
    <div id="panel-content"></div>
  </aside>
</main>

<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal-card">
    <button id="close-modal" class="close-btn" aria-label="Close">×</button>
    <div id="modal-content"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="static/vendor/leaflet/leaflet.js"></script>
<script src="static/vendor/markercluster/leaflet.markercluster.js"></script>
<script src="static/js/app.js"></script>
</body>
</html>
